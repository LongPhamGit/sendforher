<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>QR Đếm Ngược 💗</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:#090912;

    color:white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
}


/* =====================================================
   CREATOR
===================================================== */

.creator{

    width:min(950px,94%);

    margin:auto;

    padding:30px 0 60px;
}

.logo{

    font-size:32px;

    font-weight:900;

    margin-bottom:5px;
}

.subtitle{

    opacity:.6;

    margin-bottom:25px;
}

.card{

    background:#151522;

    border:1px solid #2c2c42;

    border-radius:24px;

    padding:24px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);

    margin-bottom:20px;
}

.grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:18px;
}

.full{

    grid-column:
        1/-1;
}

label{

    display:block;

    font-weight:800;

    margin-bottom:8px;
}

input[type="text"]{

    width:100%;

    padding:14px;

    border-radius:14px;

    border:1px solid #3c3c51;

    background:#0b0b13;

    color:white;

    font-size:16px;

    outline:none;
}

input[type="text"]:focus{

    border-color:#ff4f91;

    box-shadow:
        0 0 0 3px #ff4f9122;
}

small{

    display:block;

    opacity:.5;

    margin-top:7px;

    line-height:1.4;
}


/* =====================================================
   IMAGE UPLOAD
===================================================== */

.imageBox{

    display:block;

    border:2px dashed #39394f;

    border-radius:18px;

    padding:20px;

    text-align:center;

    cursor:pointer;

    transition:.2s;
}

.imageBox:hover{

    border-color:#ff4f91;

    background:#ff4f9108;
}

.imageBox input{

    display:none;
}

.imageIcon{

    font-size:40px;

    margin-bottom:8px;
}

.imagePreview{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:15px;
}

.previewItem{

    position:relative;

    width:85px;
    height:85px;

    border-radius:12px;

    overflow:hidden;
}

.previewItem img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.removeImage{

    position:absolute;

    top:4px;
    right:4px;

    width:23px;
    height:23px;

    padding:0;

    border-radius:50%;

    background:#000b;

    color:white;

    font-size:14px;
}


/* =====================================================
   BUTTON
===================================================== */

.buttons{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:22px;
}

button{

    border:0;

    cursor:pointer;

    border-radius:999px;

    padding:14px 24px;

    font-size:16px;

    font-weight:900;
}

.primary{

    background:#ff4f91;

    color:white;

    box-shadow:
        0 12px 35px #ff4f9155;
}

.secondary{

    background:#2d2d41;

    color:white;
}


/* =====================================================
   QR
===================================================== */

.result{

    display:none;

    grid-template-columns:
        220px 1fr;

    gap:25px;

    align-items:center;
}

.qr{

    width:210px;
    height:210px;

    background:white;

    padding:15px;

    border-radius:18px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.share{

    background:#0b0b13;

    padding:13px;

    border-radius:12px;

    word-break:break-all;

    font-size:12px;

    color:#ff9fc4;
}


/* =====================================================
   STAGE
===================================================== */

.stage{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 40%,
            #41253f,
            #090912 75%
        );
}

.stage.show{

    display:block;
}


/* =====================================================
   MUSIC
===================================================== */

#bgMusic{

    display:none;
}


/* =====================================================
   START
===================================================== */

.startOverlay{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    cursor:pointer;

    background:

        radial-gradient(
            circle at center,
            #492744,
            #090912 75%
        );

    backdrop-filter:blur(12px);

    -webkit-backdrop-filter:blur(12px);
}

.startHeart{

    font-size:
        clamp(90px,25vw,140px);

    color:#ff4f91;

    line-height:1;

    text-shadow:

        0 0 25px #ff4f91,

        0 0 70px #ff4f9188;

    animation:
        heartbeat 1.2s infinite;
}

.startTitle{

    font-size:
        clamp(23px,6vw,42px);

    font-weight:900;

    margin:25px 0 20px;
}

.startButton{

    display:inline-block;

    padding:16px 30px;

    border-radius:999px;

    background:#ff4f91;

    font-weight:900;

    box-shadow:
        0 12px 40px #ff4f9166;
}

.startHint{

    margin-top:14px;

    font-size:13px;

    opacity:.45;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.13);
    }

    30%{
        transform:scale(1);
    }

}


/* =====================================================
   BACKGROUND TEXT
===================================================== */

.rain{

    position:absolute;

    inset:-30%;

    overflow:hidden;

    pointer-events:none;

    opacity:.42;
}

.drop{

    position:absolute;

    top:-10vh;

    color:#ff9fc4;

    white-space:nowrap;

    font-weight:800;

    animation:
        fall linear infinite;

    text-shadow:
        0 0 12px #ff4f9144;
}

@keyframes fall{

    to{

        transform:
            translateY(135vh)
            rotate(5deg);
    }
}


/* =====================================================
   CENTER CONTENT
===================================================== */

.presentation{

    position:absolute;

    inset:0;

    z-index:10;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:
        30px 25%;

    text-align:center;

    pointer-events:none;
}


/* =====================================================
   COUNTDOWN
===================================================== */

.count{

    font-size:
        min(34vw,200px);

    font-weight:1000;

    line-height:1;

    text-shadow:

        0 0 30px #ff4f91,

        0 0 80px #ff4f9166;

    animation:
        numberIn 1.2s ease;
}

.message{

    max-width:650px;

    font-size:
        clamp(26px,5.8vw,58px);

    font-weight:900;

    line-height:1.15;

    text-shadow:
        0 4px 18px #0009;

    animation:
        messageIn 1s ease;
}

@keyframes numberIn{

    0%{

        opacity:0;

        transform:scale(.15);
    }

    65%{

        transform:scale(1.15);
    }

    100%{

        opacity:1;

        transform:scale(1);
    }
}

@keyframes messageIn{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.94);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   SIDE PHOTOS
===================================================== */

.sidePhotos{

    position:absolute;

    inset:0;

    z-index:20;

    pointer-events:none;
}

.sidePhoto{

    position:absolute;

    width:
        min(23vw,260px);

    height:
        min(30vw,340px);

    object-fit:cover;

    border-radius:22px;

    border:3px solid white;

    box-shadow:

        0 15px 45px #0009,

        0 0 35px #ff4f9166;

    opacity:0;

    animation:
        sidePhotoIn 1.2s forwards;
}


/* LEFT */

.sidePhoto.left{

    left:
        max(2vw,18px);

    transform:
        rotate(-7deg)
        translateX(-20px);
}


/* RIGHT */

.sidePhoto.right{

    right:
        max(2vw,18px);

    transform:
        rotate(7deg)
        translateX(20px);
}

@keyframes sidePhotoIn{

    from{

        opacity:0;

        transform:
            scale(.75)
            translateY(25px)
            rotate(0);
    }

    to{

        opacity:1;
    }
}


/* =====================================================
   FINAL AREA
===================================================== */

.finalArea{

    position:relative;

    width:
        min(55vw,470px);

    height:
        min(55vw,470px);

    display:flex;

    align-items:center;

    justify-content:center;

    animation:
        finalAppear 1.5s
        cubic-bezier(.17,.89,.32,1.28);
}

.heartImage{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:contain;

    filter:

        drop-shadow(
            0 0 20px #ff4f91
        )

        drop-shadow(
            0 0 60px #ff4f9188
        )

        drop-shadow(
            0 0 110px #ff4f9144
        );

    animation:
        heartPulse 2s infinite;
}

.heartMessage{

    position:relative;

    z-index:5;

    width:55%;

    text-align:center;

    font-size:
        clamp(20px,4.5vw,42px);

    font-weight:1000;

    line-height:1.12;

    text-shadow:

        0 3px 8px #79183f,

        0 0 20px #ffffffaa;
}

@keyframes finalAppear{

    from{

        opacity:0;

        transform:scale(.05);
    }

    to{

        opacity:1;

        transform:scale(1);
    }
}

@keyframes heartPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.045);
    }
}


/* =====================================================
   FINAL CONTENT
   Tất cả ảnh giữ lại
===================================================== */

.finalPhotos{

    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;
}

.finalPhoto{

    position:absolute;

    width:
        min(18vw,180px);

    height:
        min(23vw,220px);

    object-fit:cover;

    border-radius:18px;

    border:3px solid white;

    box-shadow:
        0 12px 35px #0009;

    opacity:.9;
}


/* =====================================================
   HEART RAIN
===================================================== */

.loveRain{

    position:absolute;

    inset:-20%;

    z-index:40;

    overflow:hidden;

    pointer-events:none;
}

.love{

    position:absolute;

    top:-10vh;

    animation:
        loveFall linear forwards;

    text-shadow:
        0 0 12px #ff4f91aa;
}

@keyframes loveFall{

    to{

        transform:
            translateY(135vh)
            rotate(30deg);

        opacity:.05;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .creator{

        padding-top:20px;
    }


    .grid{

        grid-template-columns:1fr;
    }


    .full{

        grid-column:auto;
    }


    .result{

        grid-template-columns:1fr;
    }


    .qr{

        margin:auto;
    }


    .presentation{

        padding:
            30px 23%;
    }


    .message{

        font-size:
            clamp(23px,7vw,38px);
    }


    .sidePhoto{

        width:24vw;

        height:31vw;

        border-radius:14px;

        border-width:2px;
    }


    .finalArea{

        width:62vw;

        height:62vw;
    }


    .heartMessage{

        width:53%;

        font-size:
            clamp(17px,4.8vw,30px);
    }


    .finalPhoto{

        width:18vw;

        height:24vw;

        border-radius:12px;

        border-width:2px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     CREATOR
===================================================== -->

<div
    class="creator"
    id="creator"
>

    <div class="logo">
        💌 QR Đếm Ngược
    </div>

    <div class="subtitle">
        Tạo một khoảnh khắc đặc biệt dành cho người ấy.
    </div>


    <div class="card">

        <div class="grid">


            <!-- =================================================
                 BACKGROUND
            ================================================== -->

            <div class="full">

                <label>
                    1. Câu nền
                </label>

                <input
                    type="text"
                    id="bg"
                    value="Anh có điều muốn nói"
                >

                <small>
                    3–5 chữ.
                </small>

            </div>


            <!-- =================================================
                 3
            ================================================== -->

            <div>

                <label>
                    2. Câu khi 3
                </label>

                <input
                    type="text"
                    id="c3"
                    value="Có một điều rất đặc biệt"
                >

            </div>


            <!-- =================================================
                 2
            ================================================== -->

            <div>

                <label>
                    3. Câu khi 2
                </label>

                <input
                    type="text"
                    id="c2"
                    value="Em sắp biết rồi đó"
                >

            </div>


            <!-- =================================================
                 1
            ================================================== -->

            <div>

                <label>
                    4. Câu khi 1
                </label>

                <input
                    type="text"
                    id="c1"
                    value="Chỉ còn một chút thôi"
                >

            </div>


            <!-- =================================================
                 FINAL
            ================================================== -->

            <div class="full">

                <label>
                    5. Câu cuối trong trái tim
                </label>

                <input
                    type="text"
                    id="final"
                    value="Anh muốn được bên em thật lâu"
                >

                <small>
                    5–8 chữ.
                </small>

            </div>


            <!-- =================================================
                 IMAGES
            ================================================== -->

            <div class="full">

                <label>
                    6. Hình ảnh của hai đứa 🥰
                </label>


                <label class="imageBox">

                    <input
                        type="file"
                        id="photos"
                        accept="image/*"
                        multiple
                        onchange="handleImages(event)"
                    >


                    <div class="imageIcon">
                        🖼️
                    </div>

                    <strong>
                        Chọn ảnh
                    </strong>

                    <small>
                        Nên chọn 3–5 ảnh.
                        Ảnh sẽ tự động resize và nén.
                    </small>

                </label>


                <div
                    class="imagePreview"
                    id="imagePreview"
                ></div>

            </div>


        </div>


        <div class="buttons">

            <button
                class="primary"
                onclick="preview()"
            >
                💗 Xem thử
            </button>


            <button
                class="secondary"
                onclick="createQR()"
            >
                🔳 Tạo QR
            </button>

        </div>

    </div>


    <!-- =====================================================
         QR
    ===================================================== -->

    <div
        class="card result"
        id="result"
    >

        <div
            class="qr"
            id="qrcode"
        ></div>


        <div>

            <h2>
                QR đã sẵn sàng 💗
            </h2>

            <p>
                Quét QR để bắt đầu.
            </p>

            <div
                class="share"
                id="shareUrl"
            ></div>

            <br>

            <button
                class="secondary"
                onclick="copyLink()"
            >
                Copy link
            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     EXPERIENCE
===================================================== -->

<div
    class="stage"
    id="stage"
>


    <!-- MUSIC -->

    <audio
        id="bgMusic"
        loop
        preload="auto"
    >

        <source
            src="music.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- START -->

    <div
        class="startOverlay"
        id="startOverlay"
        onclick="startExperience()"
    >

        <div>

            <div class="startHeart">
                ♥
            </div>

            <div class="startTitle">
                Có một điều dành cho bạn...
            </div>

            <div class="startButton">
                Chạm để mở 💗
            </div>

            <div class="startHint">
                Chạm một lần để bắt đầu
            </div>

        </div>

    </div>


    <!-- BACKGROUND -->

    <div
        class="rain"
        id="rain"
    ></div>


    <!-- SIDE PHOTOS -->

    <div
        class="sidePhotos"
        id="sidePhotos"
    ></div>


    <!-- CENTER -->

    <div
        class="presentation"
        id="presentation"
    >

        <div
            id="count"
        ></div>

    </div>


    <!-- FINAL PHOTOS -->

    <div
        class="finalPhotos"
        id="finalPhotos"
    ></div>


    <!-- HEARTS -->

    <div
        class="loveRain"
        id="loveRain"
    ></div>


</div>



<script>

/* =====================================================
   VARIABLES
===================================================== */

const $ =
    id =>
    document.getElementById(id);


let currentData =
    null;


let uploadedImages =
    [];


let started =
    false;


/* =====================================================
   WORD COUNT
===================================================== */

function wordCount(text){

    return text
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

    return text.replace(
        /[&<>"']/g,

        char => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        })[char]
    );

}


/* =====================================================
   GET DATA
===================================================== */

function getData(){

    return {

        bg:
            $("bg").value.trim(),

        c3:
            $("c3").value.trim(),

        c2:
            $("c2").value.trim(),

        c1:
            $("c1").value.trim(),

        final:
            $("final").value.trim(),

        images:
            uploadedImages

    };

}


/* =====================================================
   VALIDATE
===================================================== */

function validate(data){

    if(
        wordCount(data.bg)<3 ||
        wordCount(data.bg)>5
    )
        return "Câu nền phải có 3–5 chữ.";


    if(
        wordCount(data.c3)<3 ||
        wordCount(data.c3)>5
    )
        return "Câu khi 3 phải có 3–5 chữ.";


    if(
        wordCount(data.c2)<3 ||
        wordCount(data.c2)>5
    )
        return "Câu khi 2 phải có 3–5 chữ.";


    if(
        wordCount(data.c1)<3 ||
        wordCount(data.c1)>5
    )
        return "Câu khi 1 phải có 3–5 chữ.";


    if(
        wordCount(data.final)<5 ||
        wordCount(data.final)>8
    )
        return "Câu cuối phải có 5–8 chữ.";


    return "";

}


/* =====================================================
   IMAGE RESIZE
===================================================== */

function resizeImage(file){

    return new Promise(
        resolve => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const maxSize =
                                500;


                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(
                                width >
                                maxSize ||
                                height >
                                maxSize
                            ){

                                if(
                                    width >
                                    height
                                ){

                                    height =
                                        height *
                                        maxSize /
                                        width;

                                    width =
                                        maxSize;

                                }
                                else{

                                    width =
                                        width *
                                        maxSize /
                                        height;

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    .55
                                )
                            );

                        };


                    img.src =
                        event.target.result;

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   HANDLE IMAGE
===================================================== */

async function handleImages(event){

    const files =
        Array.from(
            event.target.files
        );


    uploadedImages =
        [];


    for(
        const file
        of files.slice(0,5)
    ){

        if(
            !file.type
            .startsWith("image/")
        )
            continue;


        const src =
            await resizeImage(
                file
            );


        uploadedImages.push(
            src
        );

    }


    renderPreviews();

}


/* =====================================================
   PREVIEW IMAGES
===================================================== */

function renderPreviews(){

    const container =
        $("imagePreview");


    container.innerHTML =
        "";


    uploadedImages.forEach(
        (src,index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "previewItem";


            item.innerHTML =

            `
                <img src="${src}">

                <button
                    class="removeImage"
                    onclick="removeImage(${index})"
                >
                    ×
                </button>
            `;


            container.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   REMOVE IMAGE
===================================================== */

function removeImage(index){

    uploadedImages.splice(
        index,
        1
    );

    renderPreviews();

}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   BACKGROUND RAIN
===================================================== */

function createRain(text){

    const rain =
        $("rain");


    rain.innerHTML =
        "";


    for(
        let i=0;
        i<150;
        i++
    ){

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "drop";


        element.innerText =
            text;


        element.style.left =
            Math.random()*100+
            "%";


        element.style.fontSize =
            10+
            Math.random()*20+
            "px";


        element.style.animationDuration =
            4+
            Math.random()*7+
            "s";


        element.style.animationDelay =
            -Math.random()*12+
            "s";


        element.style.opacity =
            .2+
            Math.random()*.5;


        rain.appendChild(
            element
        );

    }

}


/* =====================================================
   SIDE PHOTO
===================================================== */

async function showSidePhoto(
    src,
    index
){

    if(!src)
        return;


    const container =
        $("sidePhotos");


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "sidePhoto";


    /*
       xen kẽ trái / phải
    */

    if(index % 2 === 0){

        img.classList.add(
            "left"
        );

    }
    else{

        img.classList.add(
            "right"
        );

    }


    /*
       hơi lệch dọc
    */

    img.style.top =
        (
            20+
            Math.random()*55
        )+
        "%";


    img.src =
        src;


    container.appendChild(
        img
    );

}


/* =====================================================
   FINAL PHOTOS
===================================================== */

function showAllPhotos(){

    const container =
        $("finalPhotos");


    container.innerHTML =
        "";


    currentData.images
        .forEach(
            (src,index) => {

                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "finalPhoto";


                img.src =
                    src;


                /*
                   vị trí cố định quanh màn hình
                */

                const positions = [

                    {
                        left:"2%",
                        top:"12%",
                        rotate:"-8deg"
                    },

                    {
                        right:"2%",
                        top:"12%",
                        rotate:"8deg"
                    },

                    {
                        left:"3%",
                        bottom:"10%",
                        rotate:"7deg"
                    },

                    {
                        right:"3%",
                        bottom:"10%",
                        rotate:"-7deg"
                    },

                    {
                        left:"50%",
                        top:"3%",
                        rotate:"0deg"
                    }

                ];


                const p =
                    positions[index];


                if(p.left)
                    img.style.left =
                        p.left;


                if(p.right)
                    img.style.right =
                        p.right;


                if(p.top)
                    img.style.top =
                        p.top;


                if(p.bottom)
                    img.style.bottom =
                        p.bottom;


                img.style.transform =
                    `rotate(${p.rotate})`;


                container.appendChild(
                    img
                );

            }
        );

}


/* =====================================================
   HEART RAIN
===================================================== */

function createLoveRain(){

    const container =
        $("loveRain");


    container.innerHTML =
        "";


    const symbols = [

        "♥",
        "♡",
        "❤",
        "💕",
        "💗",
        "💖"

    ];


    for(
        let i=0;
        i<180;
        i++
    ){

        const heart =
            document.createElement(
                "div"
            );


        heart.className =
            "love";


        heart.innerText =
            symbols[
                Math.floor(
                    Math.random()*
                    symbols.length
                )
            ];


        heart.style.left =
            Math.random()*100+
            "%";


        heart.style.fontSize =
            10+
            Math.random()*27+
            "px";


        heart.style.animationDuration =
            3+
            Math.random()*5+
            "s";


        heart.style.animationDelay =
            Math.random()*3+
            "s";


        heart.style.opacity =
            .4+
            Math.random()*.6;


        container.appendChild(
            heart
        );

    }

}

async function startExperience(){

/* =====================================================
   ENCODE
===================================================== */

function encodeData(data){

    return btoa(
        unescape(
            encodeURIComponent(
                JSON.stringify(data)
            )
        )
    );

}


/* =====================================================
   DECODE
===================================================== */

function decodeData(encoded){

    return JSON.parse(
        decodeURIComponent(
            escape(
                atob(encoded)
            )
        )
    );

}


/* =====================================================
   CREATE QR
===================================================== */

function createQR(){

    const data =
        getData();


    const error =
        validate(data);


    if(error){

        alert(error);

        return;

    }


    const encoded =
        encodeData(data);


    const url =

        location.origin +
        location.pathname +
        "#play=" +
        encoded;


    /*
       QR quá lớn
    */

    if(
        url.length >
        7000
    ){

        alert(
            "QR quá lớn. Hãy giảm số lượng ảnh hoặc chọn ảnh nhẹ hơn."
        );

        return;

    }


    $("qrcode")
        .innerHTML =
        "";


    new QRCode(

        $("qrcode"),

        {

            text:url,

            width:180,

            height:180,

            colorDark:"#111111",

            colorLight:"#ffffff",

            correctLevel:
                QRCode.CorrectLevel.L

        }

    );


    $("shareUrl")
        .innerText =
        url;


    $("result")
        .style
        .display =
        "grid";

}


/* =====================================================
   COPY
===================================================== */

function copyLink(){

    navigator.clipboard
        .writeText(
            $("shareUrl")
            .innerText
        )
        .then(
            () =>
                alert(
                    "Đã copy link 💗"
                )
        );

}


/* =====================================================
   OPEN QR
===================================================== */

function openFromQR(){

    if(
        !location.hash
        .startsWith("#play=")
    )
        return;


    try{

        const encoded =
            location.hash
            .substring(6);


        currentData =
            decodeData(
                encoded
            );


        /*
           KHÔNG HIỆN CREATOR
        */

        $("creator")
            .style
            .display =
            "none";


        $("stage")
            .classList
            .add("show");


        $("startOverlay")
            .style
            .display =
            "flex";


        createRain(
            currentData.bg
        );

    }
    catch(error){

        console.error(
            error
        );

    }

}


/* =====================================================
   INIT
===================================================== */

openFromQR();
