<!DOCTYPE html>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:#090912;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",

/* =====================================================
   CREATOR
===================================================== */

.creator{

    width:min(950px,94%);

    margin:auto;

    padding:30px 0 60px;
}

.logo{

    font-size:32px;

    font-weight:900;

    margin-bottom:5px;

.subtitle{

    opacity:.6;

    margin-bottom:25px;

.card{

    background:#151522;

    border:1px solid #2c2c42;

    border-radius:24px;

    padding:24px;

    margin-bottom:20px;
}

.grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:18px;
}

.full{

    grid-column:
        1/-1;
}

label{

    display:block;

    font-weight:800;

    margin-bottom:8px;
}

input[type="text"]{

    width:100%;

    padding:14px;

    border-radius:14px;

    border:1px solid #3c3c51;

    background:#0b0b13;

    color:white;

    font-size:16px;

    outline:none;
}

input[type="text"]:focus{

    border-color:#ff4f91;

    box-shadow:
        0 0 0 3px #ff4f9122;
}

small{

    display:block;

    opacity:.5;

    margin-top:7px;

    line-height:1.4;

/* =====================================================
   IMAGE UPLOAD
===================================================== */

.imageBox{

    border:2px dashed #39394f;

    border-radius:18px;

    padding:20px;

    text-align:center;

    cursor:pointer;

    transition:.2s;
}

.imageBox:hover{

    border-color:#ff4f91;

    background:#ff4f9108;
}

.imageBox input{

    display:none;
}

.imageIcon{

    font-size:40px;

    margin-bottom:8px;
}

.imagePreview{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:15px;
}

.previewItem{

    position:relative;

    width:85px;
    height:85px;

    border-radius:12px;

    overflow:hidden;

    background:#0b0b13;
}

.previewItem img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.removeImage{

    position:absolute;

    top:4px;
    right:4px;

    width:23px;
    height:23px;

    padding:0;

    border-radius:50%;

    background:#000b;

    color:white;

    font-size:14px;
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons{

    display:flex;

    gap:12px;

    margin-top:22px;
}

button{

    cursor:pointer;

    border-radius:999px;

    font-size:16px;

    font-weight:900;
}

    color:white;

/* =====================================================
   QR RESULT

.result{

   MUSIC

@keyframes numberIn{

</style>

<body>

<script>

/* =====================================================
   VARIABLES
===================================================== */

const $ =
    id =>
    document.getElementById(id);


let currentData = null;

let uploadedImages = [];

let started = false;


/* =====================================================
   WORD COUNT
===================================================== */

function wordCount(text){

    return text
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return text.replace(
        /[&<>"']/g,

        char => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        })[char]
    );
}


/* =====================================================
   GET DATA
===================================================== */

function getData(){

    return {

        bg:
            $("bg").value.trim(),

        c3:
            $("c3").value.trim(),

        c2:
            $("c2").value.trim(),

        c1:
            $("c1").value.trim(),

        final:
            $("final").value.trim(),

        images:
            uploadedImages

    };
}


/* =====================================================
   VALIDATE
===================================================== */

function validate(data){

    if(
        wordCount(data.bg)<3 ||
        wordCount(data.bg)>5
    )
        return "Câu nền phải có 3–5 chữ.";


    if(
        wordCount(data.c3)<3 ||
        wordCount(data.c3)>5
    )
        return "Câu khi 3 phải có 3–5 chữ.";


    if(
        wordCount(data.c2)<3 ||
        wordCount(data.c2)>5
    )
        return "Câu khi 2 phải có 3–5 chữ.";


    if(
        wordCount(data.c1)<3 ||
        wordCount(data.c1)>5
    )
        return "Câu khi 1 phải có 3–5 chữ.";


    if(
        wordCount(data.final)<5 ||
        wordCount(data.final)>8
    )
        return "Câu cuối phải có 5–8 chữ.";


    return "";
}


/* =====================================================
   IMAGE RESIZE
===================================================== */

function resizeImage(file){

    return new Promise(
        resolve => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const maxSize =
                                600;


                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(
                                width >
                                maxSize ||
                                height >
                                maxSize
                            ){

                                if(
                                    width >
                                    height
                                ){

                                    height =
                                        height *
                                        maxSize /
                                        width;

                                    width =
                                        maxSize;

                                }
                                else{

                                    width =
                                        width *
                                        maxSize /
                                        height;

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            /*
                               JPEG quality 0.65
                               giúp giảm dữ liệu
                            */

                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    .65
                                )
                            );

                        };


                    img.src =
                        event.target.result;

                };


            reader.readAsDataURL(file);

        }
    );
}


/* =====================================================
   HANDLE IMAGES
===================================================== */

async function handleImages(event){

    const files =
        Array.from(
            event.target.files
        );


    uploadedImages = [];


    /*
       tối đa 5 ảnh
    */

    const selected =
        files.slice(0,5);


    for(
        const file of selected
    ){

        if(
            !file.type
            .startsWith("image/")
        )
            continue;


        const image =
            await resizeImage(
                file
            );


        uploadedImages.push(
            image
        );

    }


    renderPreviews();

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function renderPreviews(){

    const container =
        $("imagePreview");


    container.innerHTML =
        "";


    uploadedImages.forEach(
        (src,index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "previewItem";


            item.innerHTML =

            `
                <img src="${src}">

                <button
                    class="removeImage"
                    onclick="removeImage(${index})"
                >
                    ×
                </button>
            `;


            container.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   REMOVE IMAGE
===================================================== */

function removeImage(index){

    uploadedImages.splice(
        index,
        1
    );

    renderPreviews();

}


/* =====================================================
   FALLING TEXT
===================================================== */

function createRain(text){

    const rain =
        $("rain");


    rain.innerHTML =
        "";


    /*
       150 chữ rơi
    */

    for(
        let i=0;
        i<150;
        i++
    ){

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "drop";


        element.innerText =
            text;


        element.style.left =
            Math.random()*100+
            "%";


        element.style.fontSize =
            11+
            Math.random()*23+
            "px";


        element.style.animationDuration =
            4+
            Math.random()*7+
            "s";


        element.style.animationDelay =
            -Math.random()*12+
            "s";


        element.style.opacity =
            .2+
            Math.random()*.55;


        rain.appendChild(
            element
        );

    }

}


/* =====================================================
   HEART RAIN
===================================================== */

function createLoveRain(){

    const rain =
        $("loveRain");


    rain.innerHTML =
        "";


    const symbols = [

        "♥",
        "♡",
        "❤",
        "💕",
        "💗",
        "💖"

    ];


    for(
        let i=0;
        i<160;
        i++
    ){

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "love";


        element.innerText =
            symbols[
                Math.floor(
                    Math.random()*
                    symbols.length
                )
            ];


        element.style.left =
            Math.random()*100+
            "%";


        element.style.fontSize =
            10+
            Math.random()*27+
            "px";


        element.style.animationDuration =
            3.5+
            Math.random()*5+
            "s";


        element.style.animationDelay =
            Math.random()*2+
            "s";


        element.style.opacity =
            .4+
            Math.random()*.6;


        rain.appendChild(
            element
        );

    }

}


/* =====================================================
   SHOW PHOTO
===================================================== */

async function showPhoto(src){

    const screen =
        $("photoScreen");


    screen.innerHTML =
        "";


    if(!src)
        return;


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "photo";


    img.src =
        src;


    screen.appendChild(
        img
    );


    /*
       Ảnh tồn tại một khoảng thời gian
    */

    await wait(2400);


    screen.innerHTML =
        "";

}

async function playMusic(){

}

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}

/* =====================================================
   ENCODE
===================================================== */

function encodeData(data){

    return btoa(
        unescape(
            encodeURIComponent(
                JSON.stringify(data)
            )
        )
    );

}


/* =====================================================
   DECODE
===================================================== */

function decodeData(encoded){

    return JSON.parse(
        decodeURIComponent(
            escape(
                atob(encoded)
            )
        )
    );

}


/* =====================================================
   CREATE QR
===================================================== */

function createQR(){

    const data =
        getData();


    const error =
        validate(data);


    if(error){

        alert(error);

        return;

    }


    const encoded =
        encodeData(data);


    const url =

        location.origin +
        location.pathname +
        "#play=" +
        encoded;


    /*
       Kiểm tra độ dài.
       QR quá lớn sẽ khó quét.
    */

    if(
        url.length >
        7000
    ){

        alert(
            "Dữ liệu QR đang quá lớn. Hãy giảm số lượng ảnh hoặc chọn ảnh nhẹ hơn."
        );

        return;

    }


    $("qrcode")
        .innerHTML =
        "";


    new QRCode(

        $("qrcode"),

        {

            text:url,

            width:180,

            height:180,

            colorDark:"#111111",

            colorLight:"#ffffff",

            correctLevel:
                QRCode.CorrectLevel.L

        }

    );


    $("shareUrl")
        .innerText =
        url;


    $("result")
        .style
        .display =
        "grid";

}

function openFromQR(){

    if(
        !location.hash
        .startsWith("#play=")
    ){

    }


    try{

        const encoded =
